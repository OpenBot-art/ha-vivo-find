name: 缺陷报告 / Bug report
description: 报告一个可复现的问题 / Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认 / Before filing:
        - 已更新到最新版本，并在 HACS 里「⋯ → 重新下载」过 / Updated to the latest version and reloaded in HACS
        - 已翻过 README 的「排错」一节 / Checked the README troubleshooting section

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant 版本 / HA version
      placeholder: "2026.10.0"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: 集成版本 / Integration version
      description: HACS 集成页显示的版本号 / Version shown on the HACS integration page
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与机型 / Device & model
      description: 例如 iQOO Neo10 Pro，别名 iQOOO / e.g. iQOO Neo10 Pro, alias iQOOO
      placeholder: "iQOO Neo10 Pro"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 实际表现与预期表现的差异 / Actual behaviour vs expected behaviour
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 添加集成 / Add the integration
        2. 等待一个轮询周期 / Wait one polling cycle
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Relevant logs
      description: |
        HA 日志里与 `custom_components.vivo_find` 相关的行 / Lines from the HA log mentioning `custom_components.vivo_find`
        设置 → 系统 → 日志，或 `home-assistant.log` / Settings → System → Logs
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 截图、实体状态、地图表现等 / Screenshots, entity states, map behaviour, etc.
    validations:
      required: false
